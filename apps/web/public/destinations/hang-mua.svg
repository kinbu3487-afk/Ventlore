<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B463B" />
      <stop offset="45%" stop-color="#46786A" />
      <stop offset="85%" stop-color="#C5DFD4" />
      <stop offset="100%" stop-color="#F5F1E8" />
    </linearGradient>
    <linearGradient id="hmKarst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#234E41" />
      <stop offset="100%" stop-color="#102B23" />
    </linearGradient>
    <linearGradient id="hmRiver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D8572" />
      <stop offset="50%" stop-color="#60A894" />
      <stop offset="100%" stop-color="#3D8572" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#hmSky)" />

  <!-- Distant Karst Towers -->
  <path d="M 80 320 Q 140 180 200 310 T 360 300 T 520 280 T 680 310 L 800 320 L 800 500 L 0 500 L 0 310 Z" fill="#4B776A" opacity="0.6" />

  <!-- Valley with Winding Ngo Dong River -->
  <rect y="360" width="800" height="140" fill="#6A9788" opacity="0.4" />
  <path d="M 0 420 Q 200 380 400 450 T 800 410 L 800 480 Q 600 500 400 490 T 0 470 Z" fill="url(#hmRiver)" />

  <!-- Dramatic Foreground Limestone Karst Ridge (Dragon Spine stairs) -->
  <path d="M 280 500 L 360 360 L 440 240 L 520 160 L 580 210 L 640 290 L 760 410 L 800 500 Z" fill="url(#hmKarst)" />

  <!-- Stone steps zig-zagging up the spine to the dragon shrine -->
  <path d="M 720 460 L 660 380 L 620 320 L 560 230 L 520 160" stroke="#F0A44B" stroke-width="3" stroke-dasharray="5 3" fill="none" />

  <!-- Top Pavilion / Dragon Shrine Silhouette -->
  <path d="M 505 160 L 535 160 L 520 140 Z" fill="#F0A44B" />
  <circle cx="520" cy="135" r="5" fill="#FFFFFF" />

  <!-- Vegetation clumps -->
  <path d="M 380 340 Q 400 315 420 345" stroke="#729E8C" stroke-width="4" fill="none" />
  <path d="M 580 270 Q 600 245 620 275" stroke="#729E8C" stroke-width="4" fill="none" />
</svg>
