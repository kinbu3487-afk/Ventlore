# ==============================================================================
# Netlify Configuration for Ventlore Monorepo (apps/web)
# ==============================================================================

[build]
  base = ""
  publish = "apps/web/out"
  command = "npx --yes pnpm@9.15.4 install && npx --yes pnpm@9.15.4 --filter @ventlore/web build"

[build.environment]
  NODE_VERSION = "22"
  STATIC_EXPORT = "true"
  CI = "false"

# Optimized caching headers for immutable fonts & brand assets
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/"
  to = "/vi/"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
