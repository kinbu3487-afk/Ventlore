# ==============================================================================
# Netlify Configuration for Ventlore Monorepo (apps/web)
# ==============================================================================

[build]
  base = ""
  publish = "apps/web/out"
  command = "STATIC_EXPORT=true pnpm --filter @ventlore/web build"

[build.environment]
  NODE_VERSION = "20.18.0"
  PNPM_VERSION = "9.15.4"
  STATIC_EXPORT = "true"

# Optimized caching headers for immutable fonts & brand assets
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/"
  to = "/vi/explore"
  status = 307

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
